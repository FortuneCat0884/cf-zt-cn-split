name: 同步到Zero Trust

permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * 0'  # 每周日北京时间 11:00
  workflow_dispatch:

concurrency:
  group: cf-zt-cn-split-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: python -m pip install requests

      - name: 离线验证
        run: python -m unittest discover -s tests -v

      - name: 统一同步分流和 DNS
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PROFILE_ID: ${{ secrets.CF_PROFILE_ID }}
          WARP_EXTRA_EXCLUDES: ${{ secrets.WARP_EXTRA_EXCLUDES }}
          WARP_MAX_TOTAL_RULES: '1000'
          WARP_FALLBACK_TARGET: '200'
          MODE: exclude
        run: python cf-zt-cn-split.py
